<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Butter Car Detailing | Enquiries</title><style>body{margin:0;background:#f4f5f6;color:#15171a;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:40px auto;padding:0 20px}h1{margin-bottom:6px}.sub{color:#6f747c}.bar{display:flex;justify-content:space-between;align-items:center;margin:25px 0;gap:15px}button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;background:#15171a;color:#fff}.table{background:#fff;border:1px solid #e2e5e8;border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:820px}th,td{text-align:left;padding:15px;border-bottom:1px solid #edf0f3;font-size:13px;vertical-align:top}th{background:#fafafa;font-size:11px;text-transform:uppercase;letter-spacing:1px}.delete{background:#f3e6e6;color:#9d3636}.empty{padding:40px;text-align:center;color:#7a8089}</style></head><body><div class="wrap"><h1>Enquiry Dashboard</h1><div class="sub">Butter Car Detailing — demo administration panel</div><div class="bar"><strong id="count">Loading...</strong><button onclick="load()">Refresh</button></div><div class="table"><table><thead><tr><th>Name</th><th>Phone</th><th>Interest</th><th>Message</th><th>Date</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div><script>async function load(){const rows=document.getElementById("rows");try{const data=await fetch("/api/enquiries").then(r=>r.json());document.getElementById("count").textContent=data.length+" enquiries";rows.innerHTML=data.length?data.map(x=>`<tr><td><b>${escapeHtml(x.name)}</b></td><td>${escapeHtml(x.phone)}</td><td>${escapeHtml(x.service)}</td><td>${escapeHtml(x.message||"—")}</td><td>${new Date(x.created_at+"Z").toLocaleString()}</td><td><button class="delete" onclick="removeItem(${x.id})">Delete</button></td></tr>`).join(""):'<tr><td colspan="6" class="empty">No enquiries yet.</td></tr>'}catch(e){rows.innerHTML='<tr><td colspan="6" class="empty">Could not connect to the backend.</td></tr>'}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}async function removeItem(id){if(confirm("Delete this enquiry?")){await fetch("/api/enquiries/"+id,{method:"DELETE"});load()}}load();</script></body></html>
